name = "bybit-macd-screener"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Every 1 minute
[triggers]
crons = ["*/1 * * * *"]

[[kv_namespaces]]
binding = "BOT_KV"
id = "93a9f4b9f8b64f94b6e665f4a5015cf1"

[vars]
UNIVERSE_MODE = "auto"
SYMBOLS = ""

MODE = "sim"
GRANULARITY = "900"       # 15m candles
SCREEN_BATCH = "33"       # coins scanned per run (OI filter uses 1 subrequest)
SIM_CHECK_BATCH = "10"    # open positions re-checked per run
MAX_SYMBOLS = "60"        # coins watched
MAX_POSITIONS = "22"      # open positions at once

POSITION_MARGIN = "1"     # margin per position (USDT)
SIM_MARGIN = "1.1"        # start funds = 1.1 x 22 = 24.2 USDT

MIN_SCORE = "5"           # 5 = STRONG only, 0 = every cross
TRAIL = "1"
TRAIL_GIVEBACK = "0.4"    # give back at most 40% of the best profit

# Change this value (e.g. "3", "4") and redeploy to wipe the paper account
RESET_ID = "2"

# Open interest filter
OI_FILTER = "1"           # 1 = on, 0 = off
OI_LOOKBACK = "4"         # candles (4 x 15m = 1 hour)
OI_MIN_CHANGE = "0.005"   # OI must be up at least +0.5%
