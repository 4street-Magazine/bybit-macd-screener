name = "okx-macd-screener"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Every 2 minutes (keeps KV writes under the free-plan daily limit)
[triggers]
crons = ["*/2 * * * *"]

[[kv_namespaces]]
binding = "BOT_KV"
id = "93a9f4b9f8b64f94b6e665f4a5015cf1"

[vars]
UNIVERSE_MODE = "auto"
SYMBOLS = ""

MODE = "sim"
GRANULARITY = "300"       # 5m candles
SCREEN_BATCH = "35"       # coins scanned per run
SIM_CHECK_BATCH = "10"    # open positions re-checked per run
MAX_SYMBOLS = "60"        # coins watched
MAX_POSITIONS = "22"      # open positions at once
POSITION_MARGIN = "1"     # every position = 1 USDT margin; size = 1 x leverage (10x = 10 USDT, 30x = 30 USDT)
SIM_MARGIN = "1.1"        # start funds = 1.1 x 22 = 24.2 USDT (a little extra for fees)

LEV_FOLLOW = "30"         # coins that follow BTC
LEV_OTHER = "10"          # all other coins
FOLLOWERS = "BTC,ETH,SOL,XRP,DOGE,ADA,AVAX,LINK,DOT,LTC,BCH,SHIB,PEPE,BONK,WIF,FLOKI,NEAR,APT,ARB,OP,SUI,INJ,ATOM,UNI,AAVE,FIL,ETC,HBAR,ICP,TIA,SEI,RENDER,FET,TON"   # always 30x
BTC_CORR = "0.6"          # follower = return correlation with BTC of 0.6 or more
CORR_BARS = "100"         # candles used for the correlation

TPSL_MODE = "size"        # "size" = % of position size, "atr" = volatility-scaled
TP_USDT = "0.04"          # NET profit (USDT) at which the retracing stop switches on. 0 = old fixed-TP mode
TP_SIZE_PCT = "0.16"      # only used when TP_USDT = 0
SL_SIZE_PCT = "0.053"     # stop loss = 5.3% of position size (consider lowering, e.g. 0.01)
SL_ATR = "1.5"            # stop = 1.5 x ATR
RR_MIN = "1.5"            # reward:risk at rating 0
RR_MAX = "3"              # reward:risk at rating 8
MIN_SL_PCT = "0.0035"
MAX_SL_MARGIN = "0.30"
TRAIL = "1"               # must stay 1 when TP_USDT > 0
TRAIL_GIVEBACK = "0.4"    # give back at most 40% of the best profit
MIN_SCORE = "5"           # 5 = STRONG only, 0 = every cross
